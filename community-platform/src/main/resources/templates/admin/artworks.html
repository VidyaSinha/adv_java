<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artworks Management - Art Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-yellow-600">ArtCom Admin</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/admin/dashboard" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/admin/users" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Users
                        </a>
                        <a href="/admin/artworks" class="border-yellow-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Artworks
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="/logout" class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="md:flex md:items-center md:justify-between">
            <div class="flex-1 min-w-0">
                <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                    Artworks Management
                </h2>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" th:text="${error}"></span>
        </div>

        <!-- Artworks Grid -->
        <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <div th:each="artwork : ${artworks}" class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-4">
                    <img th:src="${artwork.imageUrl}" alt="Artwork" class="w-full h-48 object-cover rounded-lg">
                    <h4 class="mt-2 text-lg font-medium text-gray-900" th:text="${artwork.title}">Artwork Title</h4>
                    <p class="mt-1 text-sm text-gray-500" th:text="${artwork.description}">Description</p>
                    <div class="mt-2 flex items-center text-sm text-gray-500">
                        <span th:text="${artwork.user.username}">Artist</span>
                        <span class="mx-2">•</span>
                        <span th:text="${#temporals.format(artwork.createdAt, 'dd/MM/yyyy')}">Date</span>
                    </div>
                    <div class="mt-4 flex justify-between items-center">
                        <a th:href="@{/admin/artworks/{id}(id=${artwork.id})}" class="text-yellow-600 hover:text-yellow-900 text-sm font-medium">View Details</a>
                        <form th:action="@{/admin/artworks/{id}/delete(id=${artwork.id})}" method="POST" class="inline">
                            <button type="submit" class="text-red-600 hover:text-red-900 text-sm font-medium" onclick="return confirm('Are you sure you want to delete this artwork?')">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
