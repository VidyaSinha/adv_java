<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register User</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div th:replace="fragments/header"></div>
    
    <main class="max-w-2xl mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Register to ArtistCom</h2>
        <form th:action="@{/users/register}" method="post" th:object="${user}" class="space-y-6 bg-white p-6 rounded-lg shadow">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" th:field="*{username}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" placeholder="Enter your username" required/>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" th:field="*{email}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" placeholder="Enter your email" required/>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" th:field="*{password}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" placeholder="Enter your password" required/>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 rounded-md">Register</button>
            </div>

            <div class="text-center pt-4 border-t border-gray-200">
                <p class="text-sm text-gray-600">Already have an account? <a href="/login" class="text-yellow-600 hover:text-yellow-700">Login</a></p>
            </div>
        </form>
    </main>

    <div th:replace="fragments/footer"></div>
</body>
</html>
