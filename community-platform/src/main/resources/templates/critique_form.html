<form th:action="@{'/art/' + ${artwork.title} + '/critique'}" method="post" th:object="${critiqueDTO}">
    <input type="hidden" th:field="*{artworkId}" />
    <input type="hidden" name="criticId" value="1" /> <!-- Replace with actual critic ID -->
    
    <label for="technicalAnalysis">Technical Analysis:</label>
    <textarea th:field="*{technicalAnalysis}" required></textarea>

    <label for="compositionAndDesign">Composition and Design:</label>
    <textarea th:field="*{compositionAndDesign}" required></textarea>

    <label for="conceptAndMessage">Concept and Message:</label>
    <textarea th:field="*{conceptAndMessage}" required></textarea>

    <label for="suggestionsForImprovement">Suggestions for Improvement:</label>
    <textarea th:field="*{suggestionsForImprovement}" required></textarea>

    <button type="submit">Submit Critique</button>
</form>
