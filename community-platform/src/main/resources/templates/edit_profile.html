<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div th:replace="fragments/header"></div>
    
    <main class="max-w-2xl mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Edit Profile</h2>
        <form th:action="@{/users/profile/edit}" th:object="${user}" method="post" class="space-y-6 bg-white p-6 rounded-lg shadow">
            <input type="hidden" th:field="*{id}" />
            
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" th:field="*{name}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" th:field="*{email}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Bio</label>
                <textarea th:field="*{bio}" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500"></textarea>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Website</label>
                <input type="text" th:field="*{website}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Instagram</label>
                <input type="text" th:field="*{instagram}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="flex justify-end space-x-4">
                <a th:href="@{/users/profile}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md">Cancel</a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 rounded-md">Save Changes</button>
            </div>
        </form>
    </main>

    <div th:replace="fragments/footer"></div>
</body>
</html>
