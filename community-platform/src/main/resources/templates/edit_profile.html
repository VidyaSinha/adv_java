<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div th:replace="fragments/header"></div>
    
    <main class="max-w-2xl mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Edit Profile</h2>
        
        <!-- Error Messages -->
        <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${error}"></span>
        </div>

        <form th:action="@{/profile/edit}" method="post" class="space-y-6 bg-white p-6 rounded-lg shadow">
            <!-- User fields -->
            <input type="hidden" name="user.id" th:value="${user.id}" />
            
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="user.email" th:value="${user.email}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <!-- Profile fields -->
            <input type="hidden" name="profile.id" th:value="${profile.id}" />
            
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="profile.username" th:value="${profile.username}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Bio</label>
                <textarea name="profile.bio" rows="4" 
                          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500"
                          th:text="${profile.bio}"></textarea>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Website</label>
                <input type="url" name="profile.website" th:value="${profile.website}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Instagram</label>
                <input type="text" name="profile.instagram" th:value="${profile.instagram}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Portfolio</label>
                <input type="url" name="profile.portfolio" th:value="${profile.portfolio}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </div>

            <div class="flex justify-end space-x-4">
                <a th:href="@{/profile}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md">Cancel</a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 rounded-md">Save Changes</button>
            </div>
        </form>
    </main>

    <div th:replace="fragments/footer"></div>
</body>
</html>
