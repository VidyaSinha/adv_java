<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArtistCom</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="flex flex-col min-h-screen">

<!-- Header -->
<header th:fragment="header" class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold">ArtistCom</div>

        <!-- Mobile menu button -->
        <button id="menu-btn" class="md:hidden text-gray-600 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Navigation -->
        <nav id="menu" class="hidden md:flex space-x-4 items-center">
            <a class="text-gray-600 hover:text-gray-800" th:href="@{/}">Home</a>
            <a class="text-gray-600 hover:text-gray-800" th:href="@{/about}">About</a>
            <a class="text-gray-600 hover:text-gray-800" th:href="@{/community}">Community</a>
            <a class="text-gray-600 hover:text-gray-800" th:href="@{/explore}">Explore</a>
            
            <!-- Show these links only when user is authenticated -->
            <div sec:authorize="isAuthenticated()">
            <a class="text-gray-600 hover:text-gray-800" th:href="@{/profile}">Profile</a>
                
                <!-- Show admin link only for admin users -->
                <a sec:authorize="hasRole('ADMIN')" class="text-gray-600 hover:text-gray-800" th:href="@{/admin/dashboard}">Admin Panel</a>
                
                <!-- Sign Out Form -->
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="text-gray-600 hover:text-gray-800">Sign Out</button>
                </form>
            </div>
            
            <!-- Show these links only when user is not authenticated -->
            <div sec:authorize="!isAuthenticated()">
            <a class="bg-yellow-500 text-white px-4 py-2 rounded-full hover:bg-yellow-600" th:href="@{/login}">Sign In</a>
                <a class="text-gray-600 hover:text-gray-800" th:href="@{/signup}">Sign Up</a>
            </div>
        </nav>
    </div>

    <!-- Mobile menu, shown when toggled -->
    <div id="mobile-menu" class="hidden md:hidden bg-white px-4 pb-4">
        <a class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/}">Home</a>
        <a class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/about}">About</a>
        <a class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/community}">Community</a>
        <a class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/explore}">Explore</a>
        
        <!-- Show these links only when user is authenticated -->
        <div sec:authorize="isAuthenticated()">
        <a class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/profile}">Profile</a>
            
            <!-- Show admin link only for admin users -->
            <a sec:authorize="hasRole('ADMIN')" class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/admin/dashboard}">Admin Panel</a>
            
            <!-- Sign Out Form -->
            <form th:action="@{/logout}" method="post" class="block">
                <button type="submit" class="w-full text-left py-2 text-gray-600 hover:text-gray-800">Sign Out</button>
            </form>
        </div>
        
        <!-- Show these links only when user is not authenticated -->
        <div sec:authorize="!isAuthenticated()">
        <a class="block bg-yellow-500 text-white px-4 py-2 rounded-full hover:bg-yellow-600" th:href="@{/login}">Sign In</a>
            <a class="block py-2 text-gray-600 hover:text-gray-800" th:href="@{/signup}">Sign Up</a>
        </div>
    </div>
</header>

<!-- Mobile menu toggle script -->
<script>
    const btn = document.getElementById('menu-btn');
    const menu = document.getElementById('mobile-menu');

    btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
    });
</script>
</body>
</html>
